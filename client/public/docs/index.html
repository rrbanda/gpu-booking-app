<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPU Booking - Help</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="GPU Resource Booking application help and documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
</head>
<body>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: (
        '<span style="color: #CC0000; font-weight: bold; font-size: 1.2em;">GPU Booking</span><br>'
        + '<span style="font-size: 0.9em;">Help &amp; Documentation</span>'
      ),
      repo: '',
      basePath: '/docs/',
      homepage: 'getting-started.md',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      copyCode: {
        buttonText : '&#x2702;&#xFE0F;',
        errorText  : 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      search: {
        placeholder: 'Search...',
        noData: 'No results found',
        depth: 3,
        pathNamespaces: ['/docs']
      },
      plugins: [
        function(hook) {
          var footer = [
            '<footer class="footer">',
            '<hr>',
            '<small>',
            '   &copy; <time datetime="2026">2026</time> Red Hat OpenShift AI. All rights reserved.',
            '</small>',
            '</footer>'
          ].join('');
          hook.afterEach(function(html) {
            return html + footer;
          });
        }
      ]
    }
  </script>

  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-bash.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <style>
    /* Red Hat Theme */
    :root {
      --base-font-size: 14px;
      --base-font-family: "RedHatText", "Overpass", "Open Sans", Helvetica, Arial, sans-serif;
      --theme-color: #CC0000;
      --content-max-width: 75em;
      --sidebar-width: 22rem;
      --sidebar-background: #000000;
      --sidebar-nav-link-color: #ffffff;
      --sidebar-nav-link-color--hover: #CC0000;
      --sidebar-nav-link-border-color--active: #CC0000;
    }

    /* Sidebar Styling */
    .sidebar {
      background-color: #000000;
      color: #ffffff;
    }

    .sidebar a {
      color: #ffffff !important;
    }

    .sidebar a:hover {
      color: #CC0000 !important;
    }

    /* Tip boxes */
    p.tip {
      border-left-color: #CC0000;
      background-color: #fdf7e5;
    }

    p.tip:before {
      content: "Tip";
      background-color: #CC0000;
    }

    /* Code blocks */
    pre {
      background-color: #f5f5f5 !important;
      border-left: 4px solid #CC0000;
    }

    pre code {
      color: #333333;
    }

    /* Headers */
    h1 {
      border-bottom: 3px solid #CC0000;
      padding-bottom: 0.5em;
    }

    h2 {
      border-bottom: 2px solid #d2d2d2;
      padding-bottom: 0.3em;
    }

    h3 {
      color: #CC0000;
    }

    /* Links */
    a {
      color: #CC0000;
    }

    a:hover {
      color: #a30000;
    }

    /* Footer */
    footer {
      display: block;
      text-align: center;
      color: #666;
      margin-top: 3em;
    }

    /* Search */
    :root {
      --search-input-color: #333333;
      --search-input-background-color: #ffffff;
      --search-input-placeholder-color: #999999;
      --search-input-border-color: #d2d2d2;
      --search-input-border-color--focus: #CC0000;
      --search-result-heading-color: #333333;
      --search-result-item-color: #555555;
    }

    .sidebar .search input,
    .sidebar .search input[type="search"] {
      color: #333333 !important;
      background-color: #ffffff !important;
      border: 2px solid #d2d2d2 !important;
    }

    .sidebar .search input:focus,
    .sidebar .search input[type="search"]:focus {
      border-color: #CC0000 !important;
    }

    .sidebar .search input::placeholder,
    .sidebar .search input[type="search"]::placeholder {
      color: #999999 !important;
    }

    .sidebar .search .clear-button {
      color: #999999 !important;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.3em 0.6em;
      background-color: #000000;
      color: #ffffff;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 500;
      margin-right: 0.5em;
    }

    .badge-red {
      background-color: #CC0000;
    }

    .badge-blue {
      background-color: #0066CC;
    }

    .badge-amber {
      background-color: #f0ab00;
      color: #000000;
    }

    /* Alert boxes */
    .alert {
      padding: 1em 1.5em;
      margin: 1.5em 0;
      border-left: 4px solid;
      border-radius: 4px;
      background-color: #f5f5f5;
    }

    .alert-info {
      border-left-color: #2b9af3;
      background-color: #e7f2fa;
    }

    .alert-warning {
      border-left-color: #f0ab00;
      background-color: #fdf7e5;
    }

    .alert-success {
      border-left-color: #3e8635;
      background-color: #f0f8f0;
    }

    /* Key reference tables */
    table {
      border-collapse: collapse;
      width: 100%;
    }

    th {
      background-color: #151515 !important;
      color: #ffffff !important;
      padding: 0.6em 1em;
      text-align: left;
    }

    td {
      padding: 0.5em 1em;
      border-bottom: 1px solid #e0e0e0;
    }

    tr:hover td {
      background-color: #f5f5f5;
    }

    /* Image placeholder styling */
    img {
      border: 1px solid #d2d2d2;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 100%;
    }

    /* Keyboard shortcut styling */
    kbd {
      background-color: #f5f5f5;
      border: 1px solid #d2d2d2;
      border-radius: 3px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.1);
      display: inline-block;
      font-size: 0.85em;
      padding: 0.15em 0.4em;
    }
  </style>
</body>
</html>
