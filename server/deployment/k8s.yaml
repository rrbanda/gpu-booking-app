apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-booking-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gpu-booking-server-config
type: Opaque
stringData:
  ADMIN_PASSWORD: "changeme"
  BOOKING_WINDOW_DAYS: "30"
  KUEUE_SYNC_ENABLED: "true"
  KUEUE_SYNC_INTERVAL: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: rhai-tmm-kubeconfig
type: Opaque
stringData:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://api.ocp.cloud.rhai-tmm.dev:6443
        insecure-skip-tls-verify: true
      name: rhai-tmm
    contexts:
    - context:
        cluster: rhai-tmm
        namespace: user-rbanda
      name: rhai-tmm
    current-context: rhai-tmm
    users:
    - name: rhai-tmm
      user:
        token: REPLACE_WITH_BEARER_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-booking-server
  labels:
    app: gpu-booking-server
    kagenti.io/inject: enabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-booking-server
  template:
    metadata:
      labels:
        app: gpu-booking-server
        kagenti.io/inject: enabled
    spec:
      containers:
      - name: server
        image: image-registry.openshift-image-registry.svc:5000/gpu-booking-test/gpu-booking-server:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: gpu-booking-server-config
        env:
        - name: PORT
          value: "8080"
        - name: DB_PATH
          value: "/data/bookings.db"
        - name: KUBECONFIG
          value: "/etc/kubeconfig/config"
        volumeMounts:
        - name: db-storage
          mountPath: /data
        - name: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: gpu-booking-db
      - name: kubeconfig
        secret:
          secretName: rhai-tmm-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-booking-server
spec:
  selector:
    app: gpu-booking-server
  ports:
  - port: 8080
    targetPort: 8080
    name: http
