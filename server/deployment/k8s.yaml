# Secrets are in secrets.yaml.example -- copy, fill in values, apply separately.
# oc apply -f secrets.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-booking-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-booking-server
  labels:
    app: gpu-booking-server
    kagenti.io/inject: enabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-booking-server
  template:
    metadata:
      labels:
        app: gpu-booking-server
        kagenti.io/inject: enabled
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        # Pin to a versioned tag for reproducible deploys (e.g., :v1.0.0)
        image: image-registry.openshift-image-registry.svc:5000/gpu-booking-test/gpu-booking-server:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: gpu-booking-server-config
        env:
        - name: PORT
          value: "8080"
        - name: DB_PATH
          value: "/data/bookings.db"
        - name: KUBECONFIG
          value: "/etc/kubeconfig/config"
        volumeMounts:
        - name: db-storage
          mountPath: /data
        - name: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: gpu-booking-db
      - name: kubeconfig
        secret:
          # Rename this secret to match your cluster (see secrets.yaml.example)
          secretName: gpu-cluster-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-booking-server
spec:
  selector:
    app: gpu-booking-server
  ports:
  - port: 8080
    targetPort: 8080
    name: http
