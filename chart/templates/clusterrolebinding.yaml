{{- if .Values.server.kueueSync.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "booking-app.fullname" . }}-kueue-reader
  labels:
    {{- include "booking-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "booking-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "booking-app.fullname" . }}-kueue-reader
{{- end }}
